<!DOCTYPE html>
<html>
<head>
    <title>게시판</title>
</head>
<body>

    <nav>
        {% if request.user.is_authenticated %}
            <p>{{ request.user.username }}님 환영합니다!</p>
            
            <a href="{% url 'home' %}">홈</a>
            <a href="{% url 'write' %}">글쓰기</a>
            <a href="{% url 'user:logout' %}">로그아웃</a>
        {% else %}
            <a href="{% url 'home' %}">홈</a>
            <a href="{% url 'user:login' %}">로그인</a>
            <a href="{% url 'user:signup' %}">회원가입</a>
        {% endif %}
    </nav>

    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
